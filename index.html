<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💱 Convertor Valutar Live</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #080e1a; --surface: #0f1c2e; --surface2: #162035;
    --border: rgba(99,160,255,0.15); --accent: #3b82f6; --accent2: #06b6d4;
    --green: #22d3a0; --text: #e2e8f0; --muted: #64748b; --danger: #f87171;
  }
  body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 1.5rem 1rem 3rem; }
  .wrapper { width: 100%; max-width: 480px; position: relative; z-index: 1; }
  header { text-align: center; margin-bottom: 2rem; }
  .logo { font-size: 2.8rem; margin-bottom: 0.3rem; display: block; }
  h1 { font-family: 'Syne', sans-serif; font-size: 1.7rem; font-weight: 800; background: linear-gradient(135deg, #63a0ff, #22d3a0); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  .subtitle { font-size: 0.82rem; color: var(--muted); margin-top: 0.3rem; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 1.75rem; }
  .status { display: flex; align-items: center; gap: 8px; font-size: 0.78rem; color: var(--muted); margin-bottom: 1.5rem; padding: 8px 12px; background: var(--surface2); border-radius: 8px; border: 1px solid var(--border); }
  .status .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); flex-shrink: 0; }
  .status.live .dot { background: var(--green); box-shadow: 0 0 6px var(--green); animation: pulse 2s infinite; }
  .status.error .dot { background: var(--danger); }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
  .field-label { font-size: 0.75rem; font-weight: 500; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 6px; }
  .amount-row { display: flex; gap: 10px; margin-bottom: 1.25rem; }
  input[type="number"] { flex: 1; background: var(--surface2); border: 1px solid var(--border); border-radius: 12px; color: var(--text); font-family: 'Syne', sans-serif; font-size: 1.6rem; font-weight: 700; padding: 12px 16px; outline: none; -moz-appearance: textfield; }
  input[type="number"]::-webkit-outer-spin-button, input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; }
  input[type="number"]:focus { border-color: var(--accent); }
  .quick { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 1.5rem; }
  .quick button { font-size: 0.78rem; padding: 5px 12px; border-radius: 20px; border: 1px solid var(--border); background: transparent; color: var(--muted); cursor: pointer; }
  .quick button:hover { background: var(--surface2); color: var(--text); border-color: var(--accent); }
  .selectors { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: end; margin-bottom: 1.5rem; }
  .select-wrap { display: flex; flex-direction: column; }
  select { background: var(--surface2); border: 1px solid var(--border); border-radius: 12px; color: var(--text); font-size: 1rem; font-weight: 500; padding: 12px 14px; outline: none; cursor: pointer; appearance: none; -webkit-appearance: none; }
  select:focus { border-color: var(--accent); }
  .swap-btn { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--border); background: var(--surface2); color: var(--accent); font-size: 1.2rem; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
  .swap-btn:hover { background: var(--accent); color: white; transform: rotate(180deg); }
  .btn-convert { width: 100%; padding: 15px; border-radius: 14px; border: none; background: linear-gradient(135deg, var(--accent), var(--accent2)); color: white; font-family: 'Syne', sans-serif; font-size: 1rem; font-weight: 700; cursor: pointer; margin-bottom: 1rem; }
  .btn-convert:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(59,130,246,0.35); }
  .result-box { background: var(--surface2); border: 1px solid var(--border); border-radius: 14px; padding: 1.25rem; text-align: center; margin-bottom: 1rem; min-height: 110px; display: flex; flex-direction: column; justify-content: center; }
  .result-value { font-family: 'Syne', sans-serif; font-size: 1.8rem; font-weight: 800; color: var(--green); margin-bottom: 6px; }
  .result-rate { font-size: 0.8rem; color: var(--muted); }
  .pairs-title { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 10px; margin-top: 1.25rem; }
  .pairs-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .pair-card { background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; cursor: pointer; }
  .pair-card:hover { border-color: var(--accent); }
  .pair-name { font-size: 0.75rem; color: var(--muted); margin-bottom: 2px; }
  .pair-rate { font-size: 0.95rem; font-weight: 500; color: var(--text); }
  .btn-refresh { width: 100%; padding: 10px; border-radius: 10px; border: 1px solid var(--border); background: transparent; color: var(--muted); font-size: 0.82rem; cursor: pointer; margin-top: 1rem; }
  .btn-refresh:hover { color: var(--text); border-color: var(--accent); }
</style>
</head>
<body>
<div class="wrapper">
  <header>
    <span class="logo">💱</span>
    <h1>Convertor Valutar</h1>
    <p class="subtitle">Cursuri în timp real • Funcționează pe orice dispozitiv</p>
  </header>
  <div class="card">
    <div class="status" id="status"><div class="dot"></div><span id="statusText">Se încarcă cursurile live...</span></div>
    <div class="field-label">Suma de convertit</div>
    <div class="amount-row"><input type="number" id="amount" value="100" min="0" step="any" /></div>
    <div class="quick">
      <button onclick="setAmount(50)">50</button>
      <button onclick="setAmount(100)">100</button>
      <button onclick="setAmount(500)">500</button>
      <button onclick="setAmount(1000)">1 000</button>
      <button onclick="setAmount(5000)">5 000</button>
      <button onclick="setAmount(10000)">10 000</button>
    </div>
    <div class="selectors">
      <div class="select-wrap"><div class="field-label">Din</div><select id="fromCur"></select></div>
      <button class="swap-btn" onclick="swap()">⇄</button>
      <div class="select-wrap"><div class="field-label">În</div><select id="toCur"></select></div>
    </div>
    <button class="btn-convert" onclick="convert()">CONVERTEȘTE →</button>
    <div class="result-box" id="resultBox">
      <div class="result-value" id="resultVal">—</div>
      <div class="result-rate" id="resultRate">Introdu o sumă și apasă Convertește</div>
    </div>
    <div class="pairs-title">Perechi populare</div>
    <div class="pairs-grid" id="pairsGrid"></div>
    <button class="btn-refresh" onclick="loadRates()">🔄 Actualizează cursurile</button>
  </div>
</div>
<script>
const currencies = [
  {code:'EUR',symbol:'€',name:'Euro'},{code:'USD',symbol:'$',name:'Dolar american'},
  {code:'MDL',symbol:'L',name:'Leu moldovenesc'},{code:'RON',symbol:'lei',name:'Leu românesc'},
  {code:'GBP',symbol:'£',name:'Liră sterlină'},{code:'CHF',symbol:'₣',name:'Franc elvețian'},
  {code:'JPY',symbol:'¥',name:'Yen japonez'},{code:'CAD',symbol:'$',name:'Dolar canadian'},
  {code:'AUD',symbol:'$',name:'Dolar australian'},{code:'HUF',symbol:'Ft',name:'Forint unguresc'},
  {code:'BGN',symbol:'лв',name:'Lev bulgar'},{code:'UAH',symbol:'₴',name:'Hryvnia ucraineană'},
  {code:'TRY',symbol:'₺',name:'Liră turcească'},{code:'PLN',symbol:'zł',name:'Zlot polonez'},
  {code:'CZK',symbol:'Kč',name:'Coroană cehă'},{code:'RUB',symbol:'₽',name:'Rublă rusă'},
  {code:'CNY',symbol:'¥',name:'Yuan chinezesc'},
];
const popularPairs = [['MDL','EUR'],['MDL','RON'],['USD','EUR'],['GBP','USD']];
let rates = {};
const fromSel = document.getElementById('fromCur');
const toSel = document.getElementById('toCur');
const amountEl = document.getElementById('amount');
currencies.forEach(c => {
  [fromSel,toSel].forEach(sel => {
    const o = document.createElement('option');
    o.value = c.code;
    o.textContent = c.symbol+'  '+c.code+' — '+c.name;
    sel.appendChild(o);
  });
});
fromSel.value='MDL'; toSel.value='EUR';
async function loadRates() {
  const st=document.getElementById('status'), stTxt=document.getElementById('statusText');
  st.className='status'; stTxt.textContent='Se actualizează...';
  try {
    const res=await fetch('https://api.exchangerate-api.com/v4/latest/EUR');
    const data=await res.json();
    rates=data.rates; rates['EUR']=1;
    st.className='status live';
    stTxt.textContent='Live • '+new Date().toLocaleTimeString('ro-RO')+' • exchangerate-api.com';
    buildPairs();
  } catch(e) {
    rates={EUR:1,USD:1.085,RON:4.97,MDL:19.85,GBP:0.857,CHF:0.963,JPY:162.4,CAD:1.478,AUD:1.652,HUF:392.5,BGN:1.956,UAH:44.3,TRY:35.2,PLN:4.258,CZK:25.13,RUB:90.5,CNY:7.85};
    st.className='status error'; stTxt.textContent='⚠️ Fără internet — valori aproximative';
    buildPairs();
  }
}
function buildPairs() {
  const grid=document.getElementById('pairsGrid'); grid.innerHTML='';
  popularPairs.forEach(([a,b]) => {
    if(!rates[a]||!rates[b]) return;
    const r=(rates[b]/rates[a]).toFixed(4);
    const d=document.createElement('div'); d.className='pair-card';
    d.innerHTML='<div class="pair-name">'+a+' → '+b+'</div><div class="pair-rate">'+r+'</div>';
    d.onclick=()=>{fromSel.value=a;toSel.value=b;convert();};
    grid.appendChild(d);
  });
}
function convert() {
  const amount=parseFloat(amountEl.value);
  if(isNaN(amount)||amount<0||!Object.keys(rates).length) return;
  const from=fromSel.value, to=toSel.value;
  const result=(amount/rates[from])*rates[to];
  const rate=rates[to]/rates[from], inv=rates[from]/rates[to];
  const sym=currencies.find(c=>c.code===to)?.symbol||'';
  document.getElementById('resultVal').textContent=amount.toLocaleString('ro-RO')+' '+from+'  =  '+sym+' '+result.toLocaleString('ro-RO',{minimumFractionDigits:2,maximumFractionDigits:4})+' '+to;
  document.getElementById('resultRate').textContent='1 '+from+' = '+rate.toFixed(4)+' '+to+'   •   1 '+to+' = '+inv.toFixed(4)+' '+from;
}
function swap(){const tmp=fromSel.value;fromSel.value=toSel.value;toSel.value=tmp;convert();}
function setAmount(v){amountEl.value=v;convert();}
amountEl.addEventListener('input',convert);
fromSel.addEventListener('change',convert);
toSel.addEventListener('change',convert);
loadRates();
</script>
</body>
</html>
